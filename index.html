<!doctype html>
<html lang="zh-CN" data-theme="blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="本地优先的原创角色记录站" />
    <title>OC Archive · 原创角色档案馆</title>
    <script>
      (function () {
        try {
          var preset = localStorage.getItem('oc-theme-preset') || 'blue'
          var mode = localStorage.getItem('oc-theme-mode') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var el = document.documentElement
          el.setAttribute('data-theme', preset)
          el.setAttribute('data-mode', mode)
          if (dark) el.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
